# Dev infrastructure for the ESN Resource Management app.
# Brings up the three backing services the backend depends on:
#   - postgres   : application database (Prisma)
#   - minio      : S3-compatible object storage (documents)
#   - keycloak   : OIDC / JWT auth provider (realm "esn")
# minio-setup is a one-shot helper that creates the documents bucket.
#
# Usage: docker compose up -d   (see README.md / Makefile)
# NOTE: the backend (:4000) and frontend (:3000) run on the host, not here.

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: esn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: esn
      POSTGRES_PASSWORD: esn
      POSTGRES_DB: esn
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the extra `keycloak` database on first initialisation only.
      - ./keycloak/init-keycloak-db.sql:/docker-entrypoint-initdb.d/10-keycloak-db.sql:ro
    networks:
      - esn-net
    healthcheck:
      # Wait until Postgres actually accepts connections, not just the process being up.
      test: ["CMD-SHELL", "pg_isready -U esn -d esn"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. MinIO stopped distributing its community images
  # and binaries in 2025, so this runs RustFS, an S3-compatible MinIO replacement
  # (same ports, path-style S3 API). The service keeps the `minio` name so existing
  # commands (`docker compose up -d minio`) and docs still apply.
  minio:
    image: rustfs/rustfs:1.0.1
    container_name: esn-minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    networks:
      - esn-net

  # One-shot: waits for the storage API to answer, then creates the documents
  # bucket. Exits 0 once done; safe to re-run (an existing bucket is left alone).
  minio-setup:
    image: amazon/aws-cli:2.38.1
    container_name: esn-minio-setup
    depends_on:
      - minio
    networks:
      - esn-net
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1 && break;
        sleep 2;
      done;
      aws --endpoint-url http://minio:9000 s3api head-bucket --bucket esn-documents 2>/dev/null ||
      aws --endpoint-url http://minio:9000 s3 mb s3://esn-documents &&
      echo 'Bucket esn-documents ready.';
      "

  # Dev SMTP trap: Keycloak sends the set-password invite here; browse captured
  # mail at http://localhost:8025. Catches all mail regardless of domain, so the
  # invite to prenom.nom@esn.local (a fake internal domain) is readable locally.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: esn-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP (Keycloak -> Mailpit)
      - "8025:8025"   # Web inbox
    networks:
      - esn-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: esn-keycloak
    restart: unless-stopped
    # start-dev = dev mode (no HTTPS / relaxed hostname checks). State lives in
    # Postgres, not H2; --import-realm loads /opt/keycloak/data/import/*.json once.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Backwards-compatible aliases for older image tags.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Persist realms/users in Postgres (see keycloak/init-keycloak-db.sql).
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: esn
      KC_DB_PASSWORD: esn
    ports:
      - "8080:8080"
    volumes:
      # Realm "esn" (clients, roles, dev users) imported on first boot.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - esn-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  minio-data:

networks:
  esn-net:
    driver: bridge
