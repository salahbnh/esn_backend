# Dev infrastructure for the ESN Resource Management app.
# Brings up the three backing services the backend depends on:
#   - postgres   : application database (Prisma)
#   - minio      : S3-compatible object storage (documents)
#   - keycloak   : OIDC / JWT auth provider (realm "esn")
# minio-setup is a one-shot helper that creates the documents bucket.
#
# Usage: docker compose up -d   (see README.md / Makefile)
# NOTE: the backend (:4000) and frontend (:3000) run on the host, not here.

services:
  postgres:
    image: postgres:16-alpine
    container_name: esn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: esn
      POSTGRES_PASSWORD: esn
      POSTGRES_DB: esn
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - esn-net
    healthcheck:
      # Wait until Postgres actually accepts connections, not just the process being up.
      test: ["CMD-SHELL", "pg_isready -U esn -d esn"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: esn-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    networks:
      - esn-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: waits for MinIO to be healthy, then creates the documents bucket.
  # Exits 0 once done; safe to re-run (mb --ignore-existing is idempotent).
  minio-setup:
    image: minio/mc
    container_name: esn-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - esn-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/esn-documents &&
      echo 'Bucket esn-documents ready.';
      "

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: esn-keycloak
    restart: unless-stopped
    # start-dev runs an in-memory/H2 dev server; --import-realm loads /opt/keycloak/data/import/*.json
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Backwards-compatible aliases for older image tags.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      # Realm "esn" (clients, roles, dev users) imported on first boot.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - esn-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  minio-data:

networks:
  esn-net:
    driver: bridge
