name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare environment
        run: cp .env.example .env
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  integration:
    name: Integration tests (PostgreSQL + S3 storage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esn
          POSTGRES_PASSWORD: esn
          POSTGRES_DB: esn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esn -d esn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://esn:esn@localhost:5432/esn_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start object storage (docker-compose `minio` service)
        run: |
          docker compose up -d minio
          docker compose run --rm minio-setup
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=${DATABASE_URL}|" .env
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - name: Storage logs (on failure)
        if: failure()
        run: docker compose logs minio
